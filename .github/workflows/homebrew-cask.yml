name: Homebrew cask

# On every release publish (stable AND prerelease), notify the dedicated tap
# repo (andyshinn/homebrew-coresense) to bump the matching cask. The download,
# version/sha256 rewrite, and commit all happen there, in that repo's
# .github/workflows/bump.yml, using its own GITHUB_TOKEN.
#
# This job only fires the repository_dispatch, which needs a token with
# Contents:write on andyshinn/homebrew-coresense. Create a fine-grained PAT
# scoped to just that repo and store it here as the secret HOMEBREW_TAP_TOKEN.
on:
  release:
    types: [published]

jobs:
  notify-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch cask bump to homebrew-coresense
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          gh api repos/andyshinn/homebrew-coresense/dispatches \
            --method POST \
            -f "event_type=coresense-release" \
            -f "client_payload[tag]=${TAG}" \
            -F "client_payload[prerelease]=${PRERELEASE}"
